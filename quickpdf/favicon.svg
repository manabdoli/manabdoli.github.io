<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C73"/>
      <stop offset="100%" stop-color="#2F8DFF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A2A"/>
      <stop offset="100%" stop-color="#FFC857"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)"/>

  <!-- Speed lines (left) -->
  <g fill="#1C6FD6" opacity="0.9">
    <rect x="96" y="190" width="120" height="18" rx="9"/>
    <rect x="96" y="228" width="96" height="18" rx="9"/>
    <rect x="96" y="266" width="72" height="18" rx="9"/>
  </g>

  <!-- Document base -->
  <g>
    <path d="M200 128h136l56 64v192c0 13.3-10.7 24-24 24H200c-13.3 0-24-10.7-24-24V152c0-13.3 10.7-24 24-24z"
          fill="#FFFFFF"/>
    <!-- Folded corner -->
    <path d="M336 128v64h56l-56-64z" fill="#FF8A2A"/>
  </g>

  <!-- Swoosh (speed curve) -->
  <path d="M176 320c40 40 104 60 176 40
           22-6.2 40.5-16.4 55-28.7
           7.5-6.3 8.3-17.7 1.8-25.2
           -6.5-7.5-17.9-8.4-25.4-1.9
           -10.7 9.2-24.1 16.9-40.1 21.4
           -52.7 14.8-104.3 0.4-139.3-34.6
           -6.9-6.9-18.1-6.9-25 0
           -6.9 6.9-6.9 18.1 0 25z"
        fill="#FF8A2A" opacity="0.95"/>

  <!-- PDF badge -->
  <g transform="translate(312,312)">
    <circle cx="0" cy="0" r="76" fill="url(#badgeGrad)"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#0B3C73" stroke-width="6" opacity="0.9"/>

    <!-- PDF text -->
    <text x="0" y="10"
          text-anchor="middle"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="40"
          font-weight="700"
          fill="#FFFFFF">
      PDF
    </text>
  </g>

  <!-- Optional label (can be removed for pure icon) -->
